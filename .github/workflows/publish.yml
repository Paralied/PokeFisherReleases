name: Publish Windows release
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify release payload
        id: verify
        shell: python
        run: |
          import hashlib, os, pathlib, re
          version, checksum = pathlib.Path('dist/update.txt').read_text().split()
          assert re.fullmatch(r'[0-9]{1,5}(\.[0-9]{1,5}){1,3}', version)
          payload = pathlib.Path('dist/PokeAutoFisher.exe').read_bytes()
          assert payload[:2] == b'MZ'
          assert hashlib.sha256(payload).hexdigest() == checksum
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Release already published; increment the version for another build."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Poke Auto Fisher $VERSION" --notes "Made by Paralied. Download PokeAutoFisher.exe. Includes in-app updates and improved automatic casting."
          fi
          gh release upload "$tag" dist/PokeAutoFisher.exe dist/update.txt --clobber
          gh release edit "$tag" --draft=false --latest
